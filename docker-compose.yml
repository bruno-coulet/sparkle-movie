# =============================================================================
# Projet      : Sparkle Movie
# Fichier     : docker-compose.yml
# Description : Orchestre l'API FastAPI et le frontend Streamlit
# Auteurs      : Sulivan Moreau puis Bruno Coulet
# Date        : 2026-05-10
# Version     : 1.0.1
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparkle-movie-api
    # On retire "ports:" car Traefik et le Frontend passent par le réseau interne
    # ports:
    #   - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    environment:
      - PYTHONPATH=/app
    
    labels:
      - "traefik.enable=true"
      # Force Traefik à utiliser ce réseau pour ce conteneur précis
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.sparkle-api.rule=Host(`lab.zanza-creation.com`) && PathPrefix(`/sparkle-movie/api`)"
      - "traefik.http.routers.sparkle-api.priority=100"
      - "traefik.http.routers.sparkle-api.entrypoints=websecure"
      - "traefik.http.routers.sparkle-api.tls.certresolver=myresolver"
      - "traefik.http.services.sparkle-api.loadbalancer.server.port=8000"

    networks:
      - default
      - traefik-network

  
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: sparkle-movie-frontend
    # On retire "ports:" pour éviter les conflits, Traefik s'en occupe
    # ports:
    #   - "8501:8501"

    environment:
      - API_URL=http://api:8000
      - STREAMLIT_SERVER_BASE_URL_PATH=/sparkle-movie

    # Le frontend doit pouvoir communiquer avec l'API via le réseau interne de Docker
    networks:
      - default
      - traefik-network
    labels:
      - "traefik.enable=true"
      # Force Traefik à utiliser ce réseau pour ce conteneur précis
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.sparkle-front.rule=Host(`lab.zanza-creation.com`) && PathPrefix(`/sparkle-movie`)"
      - "traefik.http.routers.sparkle-front.priority=10"
      - "traefik.http.routers.sparkle-front.entrypoints=websecure"
      - "traefik.http.routers.sparkle-front.tls.certresolver=myresolver"
      - "traefik.http.services.sparkle.loadbalancer.server.port=8501"
      # Nettoie le préfixe pour Streamlit
      - "traefik.http.middlewares.sparkle-strip.stripprefix.prefixes=/sparkle-movie"
      - "traefik.http.routers.sparkle-front.middlewares=sparkle-strip"



    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

# Traefik est géré séparément, on suppose qu'il est déjà configuré pour router vers le frontend
networks:
  # Le réseau interne au projet pour api <-> frontend
  default:
    driver: bridge
  # Le réseau externe pour la communication avec Traefik
  traefik-network:
    external: true
