services:
  movies-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: movies-api
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    environment:
      - PYTHONPATH=/app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # Utilisation du sous-domaine dédié pour l'API
      - "traefik.http.routers.movies-api.rule=Host(`api.sparkle-movie.lab.zanza-creation.com`)"
      - "traefik.http.routers.movies-api.entrypoints=websecure"
      - "traefik.http.routers.movies-api.tls.certresolver=myresolver"
      - "traefik.http.services.movies-api.loadbalancer.server.port=8000"
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  movies-front:
    build:
      context: .
      dockerfile: Dockerfile.front
    container_name: movies-front
    environment:
      # On pointe sur l'URL publique pour que le navigateur du client puisse appeler l'API
      - API_URL=https://api.sparkle-movie.lab.zanza-creation.com
      - PYTHONPATH=/app
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # Utilisation du sous-domaine dédié pour le Front
      - "traefik.http.routers.movies-front.rule=Host(`sparkle-movie.lab.zanza-creation.com`)"
      - "traefik.http.routers.movies-front.entrypoints=websecure"
      - "traefik.http.routers.movies-front.tls.certresolver=myresolver"
      - "traefik.http.services.movies-front.loadbalancer.server.port=8501"
    depends_on:
      movies-api:
        condition: service_healthy
    restart: unless-stopped

networks:
  traefik:
    external: true