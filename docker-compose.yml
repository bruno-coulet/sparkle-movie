# =============================================================================
# Projet      : Sparkle Movie
# Fichier     : docker-compose.yml
# Description : Orchestre l'API FastAPI et le frontend Streamlit
# Auteur      : Sulivan Moreau
# Date        : 2026-04-19
# Version     : 1.0.0
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # ports:
    #   - "8000:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sparkle-api.rule=Host(`api.sparkle-movie.lab.zanza-creation.com`)"
      - "traefik.http.routers.sparkle-api.entrypoints=websecure"
      - "traefik.http.routers.sparkle-api.tls=true"
      - "traefik.http.services.sparkle-api.loadbalancer.server.port=8000"
    networks:
      - traefik
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  traefik:
    external: true
