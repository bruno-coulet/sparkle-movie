[project]
name = "sparkle-movie"
version = "0.1.0"
description = "Systeme de recommandation de films — MovieLens + ALS + FastAPI + Streamlit"
readme = "README.md"
authors = [
    { name = "Bruno Coulet", email = "bruno.coulet@laplateforme.io" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
    "pyspark>=3.5.0,<3.6.0",
    "streamlit>=1.28.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.6",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"frontend/app.py" = ["W291", "W293"]

[tool.pytest.ini_options]
testpaths = ["tests"]
